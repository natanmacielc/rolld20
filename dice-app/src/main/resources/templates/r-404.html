<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0918">
  <title>Rolagem não encontrada · Roll Dice</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <link rel="preload" href="/fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/lost.js"></script>
</head>
<body class="page-lost">
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gold-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7b0"/>
      <stop offset=".5" stop-color="#b98a3e"/>
      <stop offset="1" stop-color="#5e4220"/>
    </linearGradient>
  </defs>
</svg>
<div class="backdrop" aria-hidden="true">
  <div class="sky-stars"></div>
  <div class="sky-stars is-near"></div>
  <div class="sky-mist"></div>
  <div class="sky-sigil"></div>
  <div class="sky-vignette"></div>
</div>
<span class="scroll-sentinel" aria-hidden="true"></span>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Roll Dice, início">
      <img class="brand-mark" src="/favicon.svg?v=2" alt="" width="34" height="34">
      <span class="brand-name">Roll <em>Dice</em></span>
    </a>
  </div>
</header>
<main class="app lost">
  <div class="stage enter" aria-hidden="true">
    <div class="dais"></div>
    <svg class="ring" id="ring" viewBox="0 0 100 100" data-mode="idle">
      <circle class="ring-runes" cx="50" cy="50" r="49.2"/>
      <circle class="ring-rim" cx="50" cy="50" r="47.5"/>
      <circle class="ring-rim-in" cx="50" cy="50" r="45.6"/>
      <circle class="ring-progress" cx="50" cy="50" r="47.5" pathLength="100"/>
    </svg>
    <div class="tray" id="tray"></div>
  </div>
  <p class="lost-mark enter enter-1" aria-hidden="true">404</p>
  <h1 class="lost-title enter enter-1">Rolagem não encontrada</h1>
  <p class="muted enter enter-2">Esse dado rolou para debaixo da mesa. Confira o link.</p>
  <div class="cta-row enter enter-3">
    <a class="roll-btn roll-btn-link" href="/"><svg class="roll-btn-die" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path class="d20-body" d="M32 3 57.1 17.5V46.5L32 61 6.9 46.5V17.5Z"/><path class="d20-face" d="M32 16 47.5 42.5H16.5Z"/><path class="d20-edges" d="M32 3V16M6.9 17.5 32 16 57.1 17.5M6.9 17.5 16.5 42.5 6.9 46.5M57.1 17.5 47.5 42.5 57.1 46.5M16.5 42.5 32 61 47.5 42.5"/></svg><span class="roll-btn-label">Fazer uma rolagem</span></a>
  </div>
</main>
</body>
</html>
